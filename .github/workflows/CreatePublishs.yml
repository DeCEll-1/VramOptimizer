name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name'
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.tag_name }}

      - name: Debug Folder Structure
        run: |
          Write-Host "--- Repository Root ---"
          Get-ChildItem -Path . -Recurse -Depth 2
        shell: pwsh

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run publish script
        shell: pwsh
        working-directory: ./scripts
        run: ./publish.ps1 -TagName "${{ inputs.tag_name }}"

      - name: Create Release and Upload Zips
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: bin/Publish/*.zip
          generate_release_notes: true
      
      - name: Update Version Gists
        shell: pwsh
        working-directory: ./scripts
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: ./updateGist.ps1 -TagName "${{ inputs.tag_name }}"