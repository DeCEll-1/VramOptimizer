name: CI Build Check

on:
  pull_request:
    branches:
      - master

jobs:
  build-check:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests
        shell: pwsh
        working-directory: ./scripts
        run: ./runTests.ps1 -TagName "0.0.0"

      
      - name: Build
        shell: pwsh
        working-directory: ./scripts
        run: ./build.ps1 -TagName "0.0.0"
