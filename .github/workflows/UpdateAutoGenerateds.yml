name: Daily Download Telemetry

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  track-downloads:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Download Tracker
        shell: pwsh
        env:
          # Automatically mounts the temporary token provided by GitHub into your environment
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Executes your script using the project parameters
          ./.github/scripts/DownloadDataSaver.ps1 -RepoOwner "DeCEll-1" -RepoName "VramOptimizer"

      - name: Commit and Push Updated Telemetry
        shell: pwsh
        run: |
          $gitStatus = git status --porcelain ./AutoGenerated/download_data.json
          if ($gitStatus) {
              Write-Host "New telemetry data found. Updating telemetry..."
              git config --global user.name "github-actions[bot]"
              git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
              $lastCommitMsg = git log -1 --pretty=%s
              git add ./AutoGenerated/download_data.json
              if ($lastCommitMsg -eq "stats: daily total download update [skip ci]") {
                  Write-Host "Amending previous telemetry commit..."
                  git commit --amend --no-edit --no-verify
              } else {
                  git commit -m "stats: daily total download update [skip ci]"
              }
              git push --force-with-lease
          } else {
              Write-Host "Download metrics are unchanged since the last check. Skipping commit."
          }
