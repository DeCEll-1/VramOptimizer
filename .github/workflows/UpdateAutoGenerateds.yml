name: Daily Download Telemetry

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  track-downloads:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: telemetry
          fetch-depth: 0

      - name: Execute Download Tracker
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.github/scripts/DownloadDataSaver.ps1 -RepoOwner "DeCEll-1" -RepoName "VramOptimizer"

      - name: Commit and Push Updated Telemetry
        shell: pwsh
        run: |
          $gitStatus = git status --porcelain ./AutoGenerated/download_data.json
          if ($gitStatus) {
              git config --global user.name "github-actions[bot]"
              git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add ./AutoGenerated/download_data.json
              git commit -m "stats: daily total download update [skip ci]"
              git push origin telemetry
              Write-Host "Telemetry successfully updated on the telemetry branch!"
          } else {
              Write-Host "No changes in download metrics. Skipping commit."
          }
