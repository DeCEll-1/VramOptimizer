<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VramOptimizer - Download Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        h1 {
            margin: 0 0 8px 0;
            color: #f0f6fc;
        }

        .filter-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-container label {
            font-size: 0.85rem;
            color: #8b949e;
        }

        select {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            outline: none;
        }

        select:focus {
            border-color: var(--accent-color);
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .kpi-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
        }

        .kpi-title {
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 4px;
        }

        .kpi-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 24px;
        }

        .chart-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
        }

        canvas {
            width: 100% !important;
            max-height: 320px;
        }

        #error-message {
            color: #f85149;
            background: #251012;
            border: 1px solid #842029;
            padding: 12px;
            border-radius: 6px;
            display: none;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <div>
                <h1>VramOptimizer Release Analytics</h1>
                <p id="snapshot-time" style="color: #8b949e; margin: 0;"></p>
            </div>
            <!-- Tag Selection Filter -->
            <div class="filter-container">
                <label for="tag-select">Filter by Release Tag:</label>
                <select id="tag-select">
                    <option value="ALL">All Tags</option>
                </select>
            </div>
        </header>

        <div id="error-message"></div>

        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-title" id="kpi-total-title">Total Downloads</div>
                <div class="kpi-value" id="kpi-total">-</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">Selected Tag</div>
                <div class="kpi-value" id="kpi-latest">-</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-title">Top Operating System</div>
                <div class="kpi-value" id="kpi-top-os">-</div>
            </div>
        </div>

        <div class="chart-grid">
            <div class="chart-card">
                <h3>Downloads by Release Tag</h3>
                <canvas id="chartByTag"></canvas>
            </div>
            <div class="chart-card">
                <h3 id="os-chart-title">Downloads by Operating System</h3>
                <canvas id="chartByOS"></canvas>
            </div>
        </div>
    </div>

    <script>
        const DATA_URL = "https://raw.githubusercontent.com/DeCEll-1/VramOptimizer/refs/heads/master/AutoGenerated/download_data.json";

        let globalSnapshot = null;
        let chartTagInstance = null;
        let chartOSInstance = null;

        async function loadAnalytics() {
            try {
                const response = await fetch(DATA_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error ${response.status}: ${response.statusText}`);
                }
                const rawData = await response.json();

                // Get latest snapshot from array
                globalSnapshot = Array.isArray(rawData) ? rawData[rawData.length - 1] : rawData;

                populateTagDropdown(globalSnapshot);
                renderDashboard("ALL");
            } catch (err) {
                const errDiv = document.getElementById("error-message");
                errDiv.style.display = "block";
                errDiv.innerText = `Failed to load dashboard data (${DATA_URL}): ${err.message}`;
                console.error(err);
            }
        }

        function populateTagDropdown(snapshot) {
            const select = document.getElementById("tag-select");

            // Extract unique release tags in order of appearance
            const tags = [...new Set(snapshot.AssetsBreakdown.map(a => a.TagName))];

            tags.forEach(tag => {
                const option = document.createElement("option");
                option.value = tag;
                option.textContent = tag;
                select.appendChild(option);
            });

            select.addEventListener("change", (e) => {
                renderDashboard(e.target.value);
            });
        }

        function renderDashboard(selectedTag) {
            if (!globalSnapshot || !globalSnapshot.AssetsBreakdown) return;

            document.getElementById("snapshot-time").innerText =
                `Last Snapshot: ${new Date(globalSnapshot.SnapshotDate).toLocaleString()}`;

            // Filter assets by selected tag
            const filteredAssets = selectedTag === "ALL"
                ? globalSnapshot.AssetsBreakdown
                : globalSnapshot.AssetsBreakdown.filter(a => a.TagName === selectedTag);

            // Calculate aggregated metrics
            const tagTotals = {};
            const osTotals = { Windows: 0, Linux: 0, macOS: 0, Other: 0 };
            let totalDownloadsCount = 0;

            // Calculate total tag distribution (always keep full history for tag bar chart)
            globalSnapshot.AssetsBreakdown.forEach(asset => {
                const count = Number(asset.DownloadCount) || 0;
                tagTotals[asset.TagName] = (tagTotals[asset.TagName] || 0) + count;
            });

            // Calculate OS breakdown for filtered assets
            filteredAssets.forEach(asset => {
                const count = Number(asset.DownloadCount) || 0;
                totalDownloadsCount += count;

                const file = (asset.FileName || "").toLowerCase();
                if (file.includes("win")) osTotals.Windows += count;
                else if (file.includes("linux")) osTotals.Linux += count;
                else if (file.includes("osx") || file.includes("mac")) osTotals.macOS += count;
                else osTotals.Other += count;
            });

            // Update KPI Text
            document.getElementById("kpi-total-title").innerText = selectedTag === "ALL" ? "Total Downloads" : `Downloads (${selectedTag})`;
            document.getElementById("kpi-total").innerText = totalDownloadsCount;
            document.getElementById("kpi-latest").innerText = selectedTag === "ALL" ? "All Releases" : selectedTag;

            const topOS = Object.keys(osTotals).reduce((a, b) => osTotals[a] > osTotals[b] ? a : b);
            document.getElementById("kpi-top-os").innerText = osTotals[topOS] > 0 ? topOS : "N/A";
            document.getElementById("os-chart-title").innerText = selectedTag === "ALL"
                ? "Downloads by Operating System"
                : `OS Breakdown for ${selectedTag}`;

            // Destroy existing chart instances before redrawing
            if (chartTagInstance) chartTagInstance.destroy();
            if (chartOSInstance) chartOSInstance.destroy();

            // Chart 1: Downloads by Tag (Highlight selected bar)
            const tagLabels = Object.keys(tagTotals);
            const tagBackgrounds = tagLabels.map(tag =>
                (selectedTag !== "ALL" && tag === selectedTag) ? "#58a6ff" : "#3fb950"
            );

            chartTagInstance = new Chart(document.getElementById("chartByTag"), {
                type: "bar",
                data: {
                    labels: tagLabels,
                    datasets: [{
                        label: "Downloads",
                        data: Object.values(tagTotals),
                        backgroundColor: tagBackgrounds
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    onClick: (e, elements) => {
                        if (elements.length > 0) {
                            const clickedTag = tagLabels[elements[0].index];
                            document.getElementById("tag-select").value = clickedTag;
                            renderDashboard(clickedTag);
                        }
                    }
                }
            });

            // Chart 2: Downloads by OS
            chartOSInstance = new Chart(document.getElementById("chartByOS"), {
                type: "doughnut",
                data: {
                    labels: Object.keys(osTotals),
                    datasets: [{
                        data: Object.values(osTotals),
                        backgroundColor: ["#58a6ff", "#f85149", "#d29922", "#8b949e"]
                    }]
                },
                options: { responsive: true }
            });
        }

        loadAnalytics();
    </script>

</body>

</html>
